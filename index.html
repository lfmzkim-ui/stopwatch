<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff6ec">
<title>아구맨 스탑워치</title>
<style>
  :root {
    --red: #c4302b; --red-deep: #8f1d19; --red-soft: #fdecea;
    --ink: #1f1f21; --cream: #fff6ec; --card: #ffffff; --muted: #6f625b;
    --line: #f0dfd2; --glow: #ffd9d6; --green: #17743f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; color: var(--ink);
    background: radial-gradient(120% 60% at 50% 0%, #ffe4d6 0%, var(--cream) 60%);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    display: flex; justify-content: center; padding: 14px 16px 40px;
  }
  .wrap { width: 100%; max-width: 420px; position: relative; }
  .brand { position: relative; z-index: 3; text-align: center; font-weight: 800; color: var(--red-deep); font-size: 15px; letter-spacing: -.3px; }

  /* ---------- 무대 ---------- */
  .stage { position: relative; z-index: 2; height: clamp(210px, 35vh, 310px); margin-top: 4px; margin-bottom: -16px; pointer-events: none; }
  .stage .chip, .stage .toast { pointer-events: auto; }
  .dust { position: absolute; left: 12%; bottom: 14px; width: 40px; height: 40px; opacity: 0; }
  .dust i { position: absolute; bottom: 0; border-radius: 50%; background: #e8cdbd; width: 14px; height: 14px; }
  .dust i:nth-child(2) { width: 10px; height: 10px; } .dust i:nth-child(3) { width: 18px; height: 18px; }
  .running .dust { opacity: 1; }
  .running .dust i { animation: puff .6s ease-out infinite; }
  .dust i:nth-child(2) { animation-delay: .2s !important; } .dust i:nth-child(3) { animation-delay: .4s !important; }
  @keyframes puff { from { transform: translate(60px, 0) scale(.6); opacity: .7; } to { transform: translate(-40px, -14px) scale(1.5); opacity: 0; } }
  .idle .lure { opacity: 1; animation: idle 2.6s ease-in-out infinite; }
  @keyframes idle { 0%,100% { box-shadow: 0 0 3px 1px #ffb3ad; } 50% { box-shadow: 0 0 12px 5px #ff9a92; } }
  .halo { position: absolute; left: 50%; bottom: -30px; width: 78%; aspect-ratio: 1; transform: translateX(-50%);
    border-radius: 50%; background: radial-gradient(circle, #fff 0%, var(--glow) 55%, transparent 72%); opacity: .9; }
  .hero-box { position: absolute; left: 50%; bottom: -4px; height: 100%; aspect-ratio: 1569 / 2000;
    transform: translateX(-50%); transform-origin: 50% 95%; }
  .hero { width: 100%; height: 100%; display: block; }
  .lure, .lamp { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; }
  .lure { left: 61.5%; top: 0.8%; width: 7.5%; aspect-ratio: 1; background: #fff3f1; box-shadow: 0 0 0 0 #ff8a80; }
  .lamp { left: 65%; top: 41%; width: 9%; aspect-ratio: 1; background: #fff6c8; box-shadow: 0 0 18px 8px #ffe98a; }
  .running .lure { opacity: 1; animation: lure 1s ease-in-out infinite; }
  .running .lamp { opacity: .85; animation: lamp .9s ease-in-out infinite alternate; }
  @keyframes lure { 0%,100% { box-shadow: 0 0 6px 2px #ff8a80; } 50% { box-shadow: 0 0 22px 10px #ff6b61; } }
  @keyframes lamp { from { opacity: .45; } to { opacity: .95; } }
  .running .hero-box { animation: ride .42s ease-in-out infinite alternate; }
  @keyframes ride { from { transform: translateX(-50%) translateY(0) rotate(-.7deg); } to { transform: translateX(-50%) translateY(-5px) rotate(.7deg); } }
  .hop .hero-box { animation: hop .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop { 0% { transform: translateX(-50%) translateY(0) scale(1); } 40% { transform: translateX(-50%) translateY(-16px) scale(1.04); } 100% { transform: translateX(-50%) translateY(0) scale(1); } }
  .speed { position: absolute; left: 0; width: 28%; height: 100%; opacity: 0; overflow: hidden; }
  .speed i { position: absolute; left: 0; height: 3px; border-radius: 2px; background: var(--red); opacity: .35; }
  .speed i:nth-child(1) { top: 52%; width: 60%; } .speed i:nth-child(2) { top: 62%; width: 85%; } .speed i:nth-child(3) { top: 72%; width: 45%; }
  .running .speed { opacity: 1; }
  .running .speed i { animation: dash .5s linear infinite; }
  .speed i:nth-child(2) { animation-delay: .15s !important; } .speed i:nth-child(3) { animation-delay: .3s !important; }
  @keyframes dash { from { transform: translateX(120%); opacity: 0; } 30% { opacity: .4; } to { transform: translateX(-60%); opacity: 0; } }
  .road { position: absolute; left: -16px; right: -16px; bottom: 0; height: 4px;
    background: repeating-linear-gradient(90deg, #e9d3c4 0 30px, transparent 30px 56px); background-size: 56px 4px; }
  .running .road { animation: roll .45s linear infinite; }
  @keyframes roll { to { background-position: -56px 0; } }
  .chip { position: absolute; right: 0; top: 6px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 800;
    padding: 6px 12px; border-radius: 999px; transition: background .2s; }
  .running .chip { background: var(--red); }
  .toast { position: absolute; left: 0; top: 6px; background: #fff; border: 2px solid var(--red); color: var(--red); font-weight: 800; font-size: 13px;
    padding: 5px 11px; border-radius: 999px; opacity: 0; transform: translateY(6px); transition: .25s; }
  .toast.on { opacity: 1; transform: none; }

  /* ---------- 패널 ---------- */
  .panel { position: relative; z-index: 1; padding-top: 26px !important; background: var(--card); border-radius: 26px; padding: 18px 18px 18px;
    border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(143,29,25,.14); }
  .time { text-align: center; font-variant-numeric: tabular-nums; font-weight: 800; line-height: 1.05;
    font-size: clamp(54px, 18vw, 80px); letter-spacing: -2px; }
  .time .ms { color: var(--red); font-size: .55em; letter-spacing: 0; }
  .meter { height: 6px; border-radius: 3px; background: var(--red-soft); margin: 10px 4px 0; overflow: hidden; }
  .meter b { display: block; height: 100%; width: 0; background: var(--red); border-radius: 3px; }
  .meter-cap { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }

  .btns { display: grid; grid-template-columns: 1fr 1.7fr 1fr; gap: 10px; margin-top: 16px; }
  button { font: inherit; font-weight: 800; border-radius: 18px; border: 2px solid var(--line); background: #fff; color: var(--ink);
    cursor: pointer; min-height: 64px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    transition: transform .08s; }
  button .big { font-size: 17px; line-height: 1.1; } button .sub { font-size: 11px; font-weight: 600; color: var(--muted); }
  button:active:not(:disabled) { transform: scale(.95); }
  button:disabled { background: #f6efe9; border-style: dashed; color: #9c8f87; cursor: default; }
  button:disabled .sub { color: #9c8f87; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.go { background: var(--red); border-color: var(--red); color: #fff; } button.go .big { font-size: 22px; } button.go .sub { color: #ffe3e0; }
  button.stop { background: var(--ink); border-color: var(--ink); color: #fff; } button.stop .big { font-size: 22px; } button.stop .sub { color: #d6d0cb; }
  .hint { text-align: center; color: var(--muted); font-size: 11.5px; margin-top: 10px; }

  .laps { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .laps-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; font-weight: 800; }
  .laps-head span { color: var(--muted); font-weight: 600; font-size: 12px; }
  .lap-list { max-height: 190px; overflow-y: auto; }
  .row { display: grid; grid-template-columns: 1.1fr 1fr 1fr; padding: 9px 4px; border-bottom: 1px dashed var(--line); font-variant-numeric: tabular-nums; font-size: 15px; }
  .row span:not(:first-child) { text-align: right; }
  .row.best { color: var(--green); font-weight: 800; } .row.worst { color: var(--red); font-weight: 800; }
  .row em { font-style: normal; font-size: 11px; margin-left: 4px; }
  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 12px 0 2px; }
  .tools { display: flex; justify-content: flex-end; margin-top: 8px; }
  .tools button { min-height: 0; padding: 6px 12px; border-radius: 999px; font-size: 12px; flex-direction: row; }

  /* ---------- 지나가는 해산물 ---------- */
  .sea { position: absolute; left: -16px; right: -16px; top: 0; bottom: 0; overflow: hidden; opacity: 0; transition: opacity .5s; }
  .running .sea { opacity: 1; }
  .sea svg { position: absolute; left: 0; width: 46px; height: auto; color: var(--red); opacity: .9;
    transform: translateX(120vw); animation: drift linear infinite; animation-play-state: paused; }
  .running .sea svg { animation-play-state: running; }
  .sea .a { top: 20%; width: 52px; animation-duration: 6.5s; animation-delay: -1s; color: #ff9a3c; }
  .sea .b { top: 40%; width: 40px; animation-duration: 8s; animation-delay: -5s; color: #ff6f8a; }
  .sea .c { top: 58%; width: 46px; animation-duration: 7s; animation-delay: -3s; color: #e8483c; }
  .sea .d { top: 12%; width: 36px; animation-duration: 9s; animation-delay: -7s; color: #a371e0; }
  .sea .e { top: 70%; width: 32px; animation-duration: 10s; animation-delay: -2s; color: #f2b84b; }
  .sea .f { top: 30%; width: 44px; animation-duration: 7.6s; animation-delay: -4s; color: #3fa7e0; }
  /* 회전 바퀴 (원본 바퀴 위 덧그림) */
  .wheel { position: absolute; width: 17%; aspect-ratio: 1; border-radius: 50%; pointer-events: none; }
  .wheel svg { width: 100%; height: 100%; display: block; animation: spin .5s linear infinite; animation-play-state: paused; transform-origin: 50% 50%; }
  .running .wheel svg { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .wheel.front { left: 60.8%; top: 79.2%; }
  @keyframes drift { from { transform: translateX(calc(100% + 460px)); } to { transform: translateX(-120%); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>

  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ running, elapsed, laps, wall: Date.now(), startedWall: running ? Date.now() - (now() - startAt) : 0 })); } catch (e) {}
  }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (!s) return;
      elapsed = s.elapsed || 0; laps = s.laps || [];
      if (s.running) { const spent = Date.now() - s.startedWall; running = true; startAt = now() - spent; elapsed = s.elapsed; }
    } catch (e) {}
  }
  let lastMin = 0;
  function hop() { app.classList.remove('hop'); void app.offsetWidth; app.classList.add('hop'); setTimeout(() => app.classList.remove('hop'), 480); }
  function render() {
    const t = total();
    timeEl.innerHTML = fmt(t, true);
    meter.style.width = ((t % 60000) / 600) + '%';
    const min = Math.floor(t / 60000);
    if (running && min > lastMin) { say(min + '분 달렸어요!'); hop(); }
    lastMin = min;
    document.title = running ? fmt(t).replace(/\.\d+$/, '') + ' · 아구맨 배달 중' : '아구맨 스탑워치';
    if (running) raf = requestAnimationFrame(render);
  }
  function sync() {
    app.classList.toggle('running', running);
    app.classList.toggle('idle', !running);
    toggleBtn.className = running ? 'stop' : 'go';
    toggleBtn.innerHTML = running ? '<span class="big">정차</span><span class="sub">일시정지</span>'
      : (elapsed ? '<span class="big">다시 출발</span><span class="sub">이어서</span>' : '<span class="big">출발!</span><span class="sub">시작</span>');
    lapBtn.disabled = !running; resetBtn.disabled = running || !elapsed;
    chip.textContent = running ? '배달 중' : (elapsed ? '정차 중' : '출발 대기');
    save(); keepAwake();
  }
  let wake = null;
  async function keepAwake() {
    try {
      if (running && !wake && 'wakeLock' in navigator && document.visibilityState === 'visible') {
        wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; });
      } else if (!running && wake) { await wake.release(); wake = null; }
    } catch (e) { wake = null; }
  }
  document.addEventListener('visibilitychange', keepAwake);
  function say(msg) {
    toast.textContent = msg; toast.classList.add('on'); clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('on'), 1400);
  }
  function toggle() {
    if (running) { elapsed += now() - startAt; running = false; cancelAnimationFrame(raf); render(); }
    else { startAt = now(); running = true; render(); }
    sync();
  }
  function lap() {
    if (!running) return;
    laps.push(total()); renderLaps(); save();
    say(laps.length + '번 배달 완료!'); hop();
  }
  let armed = 0;
  function reset() {
    if (running) return;
    if (laps.length && !armed) {
      armed = setTimeout(() => { armed = 0; resetBtn.innerHTML = '<span class="big">복귀</span><span class="sub">초기화</span>'; }, 2500);
      resetBtn.innerHTML = '<span class="big">정말?</span><span class="sub">한 번 더 누르면 삭제</span>';
      say('기록 ' + laps.length + '건이 지워져요'); return;
    }
    clearTimeout(armed); armed = 0; resetBtn.innerHTML = '<span class="big">복귀</span><span class="sub">초기화</span>';
    elapsed = 0; laps = []; lastMin = 0; render(); renderLaps(); sync();
  }
  function renderLaps() {
    countEl.textContent = laps.length ? laps.length + '건' : '';
    copyBtn.disabled = !laps.length;
    if (!laps.length) { lapsEl.innerHTML = '<div class="empty">아직 배달 기록이 없어요</div>'; return; }
    const sp = laps.map((t, i) => t - (laps[i - 1] || 0));
    const min = Math.min(...sp), max = Math.max(...sp);
    lapsEl.innerHTML = sp.map((d, i) => {
      const c = sp.length > 2 ? (d === min ? 'best' : d === max ? 'worst' : '') : '';
      const tag = c === 'best' ? '<em>최단</em>' : c === 'worst' ? '<em>최장</em>' : '';
      return `<div class="row ${c}"><span>${i + 1}번${tag}</span><span>${fmt(d)}</span><span>${fmt(laps[i])}</span></div>`;
    }).reverse().join('');
  }
  async function copyLaps() {
    const sp = laps.map((t, i) => t - (laps[i - 1] || 0));
    const txt = '배달\t구간\t누적\n' + sp.map((d, i) => `${i + 1}\t${fmt(d)}\t${fmt(laps[i])}`).join('\n');
    try { await navigator.clipboard.writeText(txt); say('기록을 복사했어요'); } catch (e) { say('복사에 실패했어요'); }
  }
  toggleBtn.onclick = toggle; lapBtn.onclick = lap; resetBtn.onclick = reset; copyBtn.onclick = copyLaps;
  document.addEventListener('keydown', e => {
    if (e.repeat || e.target.tagName === 'BUTTON' && e.code === 'Space') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.code === 'KeyL') lap(); else if (e.code === 'KeyR') reset();
  });
  load(); lastMin = Math.floor(total() / 60000); renderLaps(); render(); sync();
  if (running) raf = requestAnimationFrame(render);
</script>
</body>
</html>
